name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build the app
        run: gradle assembleRelease --no-daemon -PficVersion=${{ github.run_number }}

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk FicNook.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FicNook-apk
          path: FicNook.apk

      # The app checks the newest release to offer in-app updates, so each build gets its own numbered release.
      - name: Put the APK on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.run_number }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create "v$NUM" FicNook.apk --latest \
            --title "Fic Nook 1.$NUM" \
            --notes "Tap FicNook.apk below on your Android phone to download and install it. If you already have Fic Nook 1.3 or newer, the app offers this update by itself."
